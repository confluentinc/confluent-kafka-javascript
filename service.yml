name: confluent-kafka-javascript
lang: unknown
lang_version: unknown
git:
  enable: true
codeowners:
  enable: true
semaphore:
  enable: true
  pipeline_enable: false
  tasks:
    - name: post-install
      branch: master
      pipeline_file: .semaphore/post_install.yml
      parameters:
        - name: LIBRARY_VERSION
          required: true
          description: Which library version to install.
          default_value: latest
  managed_sections:
    - version
    - name
    - agent
    - global_job_config
sonarqube:
  enable: true
  coverage_reports:
    - ./coverage/lcov.info
  languages:
    - javascript
    - typescript
  analysis_exclusions:
    - '**/*.pb.*'
    - '**/mk-include/**/*'
    - examples/**
    - schemaregistry-examples/**
    - schemaregistry/e2e/**
